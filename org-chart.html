<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Department: Org Chart</title>
<style>
  :root{
    --canvas:#f6f7f9; --dot:#d4d8de; --card:#ffffff; --ink:#1a1d21; --sub:#6b7280;
    --line:#c3c9d2; --accent:#3b6ef5; --pill:#f1f3f6; --border:#e5e8ec; --ok:#16a34a;
  }
  *{box-sizing:border-box; margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background-color:var(--canvas);
    background-image:radial-gradient(var(--dot) 1.1px, transparent 1.1px);
    background-size:22px 22px;
    min-height:100vh; padding:40px 24px 80px;
  }
  header{max-width:1080px;margin:0 auto 8px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:22px;font-weight:700}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);
    background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 12px}
  .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .stamp{font-size:12px;color:var(--sub)}
  .chart{margin:26px auto 0;width:100%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
  .tree{min-width:max-content;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
  .stack{display:flex;flex-direction:column;align-items:center}
  .tree ul{display:flex;align-items:flex-start;justify-content:center;padding:0;margin:0;list-style:none}
  .tree li{display:flex;flex-direction:column;align-items:center;position:relative;padding:26px 13px 0}
  .tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:26px;border-top:1.6px dashed var(--line)}
  .tree li::after{right:auto;left:50%;border-left:1.6px dashed var(--line)}
  .tree li:first-child::before{border-top:none}
  .tree li:last-child::after{border-top:none}
  .tree li:only-child::before{display:none}
  .dept-node{width:260px;background:rgba(255,255,255,.65);border:1.4px dashed var(--line);border-radius:14px;padding:12px 16px;text-align:center}
  .dept-node h2{font-size:15px;font-weight:800;letter-spacing:.01em}
  .dept-node span{font-size:12px;color:var(--sub)}
  .tree .card{width:260px}
  .tree .team-head{width:260px}
  .tree .empty-note{width:260px}

  .pill-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 12px}
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px auto 0;max-width:1080px}
  .tab{font-family:inherit;font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;cursor:pointer;
    background:var(--card);border:1px solid var(--border);color:var(--sub);
    box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .tab:hover{border-color:var(--line);color:var(--ink)}
  .tab.active{border-color:var(--accent);color:var(--accent);
    box-shadow:0 1px 2px rgba(59,110,245,.15),0 4px 12px rgba(59,110,245,.10)}
  .connector{width:0;height:26px;border-left:1.6px dashed var(--line);position:relative}
  .connector::after{content:"";position:absolute;left:-4.4px;bottom:-1px;border:4px solid transparent;border-top:6px solid var(--line)}
  .node-dot{width:9px;height:9px;border-radius:50%;background:var(--card);border:1.6px solid var(--line);margin:-5px 0}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);padding:14px 16px;width:300px;overflow-wrap:break-word}
  .card.brain{width:460px;border-radius:16px}
  .card.chief{border:1.6px solid var(--accent);box-shadow:0 1px 2px rgba(59,110,245,.15),0 8px 22px rgba(59,110,245,.12)}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--sub);
    background:var(--pill);border-radius:999px;padding:3px 10px;margin-bottom:10px}
  .tag .sq{width:10px;height:10px;border-radius:3px;background:var(--accent);opacity:.85}
  .who{display:flex;gap:12px;align-items:flex-start}
  .ava{width:46px;height:46px;border-radius:10px;background:#eef1f5;flex:0 0 auto;overflow:hidden;image-rendering:pixelated}
  .who h3{font-size:15.5px;font-weight:700;line-height:1.25}
  .who p{font-size:12.5px;color:var(--sub);line-height:1.45;margin-top:3px}
  .tools{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
  .tools span{font-size:11px;font-weight:600;background:var(--pill);border:1px solid var(--border);
    border-radius:6px;padding:3px 8px;color:#3a3f47}
  .seeded .ava{filter:grayscale(1);opacity:.55}
  .seeded h3{color:#7a8089}
  .state{font-size:10.5px;font-weight:600;letter-spacing:.02em;margin-top:10px;color:var(--ok)}
  .seeded .state{color:#9aa1ab}

  .team-head{width:300px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;
    box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .team-head h2{font-size:14px;font-weight:700}
  .team-head p{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.4}
  .empty-note{font-size:12px;color:var(--sub);background:var(--pill);border:1px dashed var(--line);
    border-radius:10px;padding:10px 14px;width:300px;text-align:center;line-height:1.5}
  footer{max-width:1080px;margin:46px auto 0;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1 id="title">Your Department</h1>
  <span class="live">Live</span>
  <span class="stamp" id="stamp"></span>
</header>
<div class="tabs" id="tabs"></div>
<div class="chart" id="chart"></div>
<footer>This chart is generated from the real <b>departments/</b> tree in this repo.<br>
Changed a team or hire? Tell claude: <b>"update the org chart"</b>. It rereads the folders and rewrites the data below.</footer>

<script>
// ====== OWNER LINE (yours, claude sets this on Day 1, edit freely) ======
const OWNER = { business: "Tadeas AI" };
// ====== DATA (regenerated by claude from the live tree; do not hand-edit) ======
const DEPT = {
  generated: "2026-09-12",
  brain: {
    name: "The Shared Brain",
    desc: "What every hire reads before it works. Your business, your voice, your rules.",
    files: ["business.md","brand/ (9 files)","knowledge/","routines/"]
  },
  chief: {
    name: "Claude",
    desc: "Reads the standing rules, staffs every seat, runs the whole department.",
    tools: ["CLAUDE.md","memory","routines/"]
  },
  departments: [
    { name:"Marketing", teams:[
    { name:"Content Team", desc:"Everything you publish. Four seats to start, specialists grow when earned.",
      hires:[ {name:"Copywriter", desc:"Writes everything with words in it, in your voice. Hooks get their own pass.", tools:["draft-post","write-hooks"], live:false},
        {name:"Social Manager", desc:"One seat for all of social: calendar, staging, the numbers.", tools:["plan-the-week","post-content","read-the-stats"], live:false},
        {name:"Editor", desc:"The second pass before you see it.", tools:["voice.md"], live:true},
        {name:"Designer", desc:"Visuals in your colors and fonts.", tools:["colors.md"], live:false} ] },
    { name:"Follow-Up Team", desc:"After somebody already knows you.",
      hires:[ {name:"Reply Agent", desc:"Drafts responses in your voice. You send.", tools:["voice.md"], live:false},
        {name:"Nurture Agent", desc:"Keeps warm leads warm, flags the going-quiet.", tools:["inbox"], live:false} ] },
    { name:"Research Team", desc:"What's happening outside your business. Day 13.",
      hires:[ {name:"Researcher", desc:"Competitors, swipes, outliers. Feeds the brain.", tools:["competitor-check","collect-swipes","find-outliers"], live:false} ] },
    { name:"Ads Team", desc:"Paid traffic, when you're ready. Drop.",
      hires:[ {name:"Growth Lead", desc:"One recommendation instead of five dashboards.", tools:["reports"], live:false},
        {name:"Ads Manager", desc:"Campaigns staged, your word launches.", tools:["ad platform"], live:false},
        {name:"Ad Writer", desc:"Variants from your offer and ICP.", tools:["offer.md"], live:false} ] },
    { name:"Newsletter Team", desc:"The email they actually open. List health checked before a sequence gets planned.",
      hires:[ {name:"Newsletter Writer", desc:"Plans a sequence, then drafts one issue at a time, your voice.", tools:["plan-sequence","write-issue"], live:false},
        {name:"List Manager", desc:"Growing or just aging? Keeps you honest.", tools:["read-list-health"], live:false} ] }
,
    { name:"Website Team", desc:"Your pages, live, and the traffic that finds them. Day 10.",
      hires:[ {name:"Page Builder", desc:"One page, one job. The craft comes pre-loaded.", tools:["build-a-page","page-copy","style-the-page"], live:true},
        {name:"Traffic Agent", desc:"Found by search engines and AI engines both.", tools:["seo-foundations","ai-visibility","weekly-traffic-read","speed-check"], live:true} ] }
    ] },
    { name:"Sales", teams:[
    { name:"Sales Team", desc:"Stranger to booked call. Day 11.",
      hires:[ {name:"Assessment Agent", desc:"Asks what tells you a lead fits.", tools:["assessment"], live:false},
        {name:"Calendar Agent", desc:"Qualified people onto your calendar.", tools:["Calendly"], live:false},
        {name:"CRM Agent", desc:"Remembers every lead.", tools:["inbox"], live:false} ] }
    ] },
    { name:"IT / Systems", teams:[
    { name:"Dev Team", desc:"PRE-BUILT. Summon it: 'set up my code base' or 'ship my landing page'. Day 8.",
      hires:[ {name:"Planner", desc:"One-page plan, your yes, then the work.", tools:["one-plan"], live:true},
        {name:"GitHub Agent", desc:"Saved work, history you can undo to.", tools:["save-work","set-up-repo","add-from-template"], live:false},
        {name:"Vercel Agent", desc:"Your pages on the live internet.", tools:["ship-a-page"], live:false},
        {name:"Supabase Agent", desc:"The filing cabinet your tools can reach.", tools:["set-up-project"], live:false},
        {name:"Keys Agent", desc:"Keys in the env file, skipped when you save to GitHub.", tools:["add-a-key"], live:true},
        {name:"API Manager", desc:"Owns the doors: which tools are wired, and how.", tools:["wire-a-tool","pick-the-door","connection-check"], live:true},
        {name:"Test Agent", desc:"The stranger test, before it ships.", tools:["pre-ship-check"], live:true},
        {name:"Code Reviewer", desc:"Reads the changes before they save. Second pair of eyes.", tools:["review-changes"], live:true},
        {name:"Security Checker", desc:"Sweeps for leaks, holds the baseline.", tools:["security-sweep","harden-the-basics"], live:true},
        {name:"Payments Agent", desc:"For the day you take money. Drop.", tools:["drop pending"], live:false} ] }
    ] }
  ]
};
// ====== END DATA ======

// deterministic 8-bit avatar per name (mirrored 5x5 -> 10x10 pixel face)
function avatar(name){
  let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0;
  const hue=h%360, pal=[`hsl(${hue},62%,52%)`,`hsl(${(hue+40)%360},58%,38%)`,`hsl(${hue},45%,80%)`];
  let cells="";
  for(let y=0;y<10;y++)for(let x=0;x<5;x++){
    const bit=(h>>((y*5+x)%31))&1, b2=(h>>((y*3+x*7)%29))&1;
    if(bit){const col=pal[(y+x+b2)%3];
      cells+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${col}"/><rect x="${9-x}" y="${y}" width="1" height="1" fill="${col}"/>`;}
  }
  return `<svg viewBox="0 0 10 10" width="46" height="46" xmlns="http://www.w3.org/2000/svg"><rect width="10" height="10" fill="#e8ecf1"/>${cells}</svg>`;
}
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function card(o,cls,tag){
  return `<div class="card ${cls}${o.live===false?' seeded':''}">
    <span class="tag"><span class="sq"></span>${tag}</span>
    <div class="who"><span class="ava">${avatar(o.name)}</span>
      <div><h3>${esc(o.name)}</h3><p>${esc(o.desc)}</p></div></div>
    <div class="tools">${(o.tools||o.files||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    ${o.live===undefined?"":`<div class="state">${o.live?"● live":"○ seeded, not connected yet"}</div>`}
  </div>`;
}
const el=document.getElementById("chart");
document.getElementById("title").textContent=OWNER.business+(OWNER.business==="Your Department"?"":": Your Department");
document.getElementById("stamp").textContent="generated "+DEPT.generated+" from the live tree";
const hireChain=t=>{
  if(!t.hires.length) return `<div class="empty-note">Empty on purpose.<br>Your audit decides who works here.</div>`;
  return t.hires.map(h=>card(h,"","Agent")).join('<div class="connector" style="height:14px"></div>');
};
function deptLi(d){
  let s=`<li><div class="dept-node"><h2>${esc(d.name)}</h2><span>${d.teams.length} team${d.teams.length>1?"s":""} · ${d.teams.reduce((a,t)=>a+t.hires.length,0)} seats</span></div>
    <div class="connector"></div><ul>`;
  for(const t of d.teams){
    s+=`<li><div class="team-head"><h2>${esc(t.name)}</h2><p>${esc(t.desc)}</p></div>
      <div class="node-dot"></div><div class="connector" style="height:14px"></div>${hireChain(t)}</li>`;
  }
  return s+`</ul></li>`;
}
function render(sel){
  const depts=sel==="all"?DEPT.departments:DEPT.departments.filter(d=>d.name===sel);
  let html=`<div class="tree"><div class="stack">
    <span class="pill-label">Every session starts here</span>
    <div class="connector"></div>${card(DEPT.brain,"brain","Shared Brain")}
    <div class="node-dot"></div><div class="connector"></div>
    ${card(DEPT.chief,"chief","Agent · Orchestrator")}
    <div class="node-dot"></div>
    <span class="pill-label">AI connection</span>
    <div class="connector"></div></div><ul>`;
  for(const d of depts) html+=deptLi(d);
  html+=`</ul></div>`;
  el.innerHTML=html;
  fit();
}
function fit(){
  const t=el.querySelector(".tree");
  if(!t) return;
  el.style.height="";
  t.style.transform="none";
  const w=t.offsetWidth,h=t.offsetHeight;
  const s=Math.min(1,el.clientWidth/w);
  t.style.transformOrigin="top center";
  t.style.transform=`scale(${s})`;
  el.style.height=(h*s)+"px";
}
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=[`<button class="tab active" data-sel="all">Everything</button>`]
  .concat(DEPT.departments.map(d=>`<button class="tab" data-sel="${esc(d.name)}">${esc(d.name)}</button>`)).join("");
tabsEl.addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  tabsEl.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
  render(b.dataset.sel);
});
render("all");
window.addEventListener("resize",fit);
</script>
</body>
</html>
